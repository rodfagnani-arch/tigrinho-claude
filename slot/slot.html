<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big Bass Splash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="slot.css" />
</head>
<body>

<div class="machine-wrap">
  <div class="fish-deco">🌿 🐟 🌿 🐠 🌿</div>

  <!-- ==========================================
       TÍTULO — edite o nome aqui
       ========================================== -->
  <div class="machine-title">BIG BASS SPLASH</div>
  <div class="subtitle">🎣 Conecte 4 ou mais símbolos 🎣</div>

  <div class="machine-body">
    <div class="machine-inner">
      <div class="water-bar"></div>

      <!-- ROLOS -->
      <div class="reels-container" id="reelsContainer">
        <div class="reel-wrapper" id="reel0">
          <div class="reel-shimmer"></div>
          <div class="reel-shimmer-bottom"></div>
          <div class="reel" id="reelTrack0"></div>
        </div>
        <div class="reel-wrapper" id="reel1">
          <div class="reel-shimmer"></div>
          <div class="reel-shimmer-bottom"></div>
          <div class="reel" id="reelTrack1"></div>
        </div>
        <div class="reel-wrapper" id="reel2">
          <div class="reel-shimmer"></div>
          <div class="reel-shimmer-bottom"></div>
          <div class="reel" id="reelTrack2"></div>
        </div>
        <div class="reel-wrapper" id="reel3">
          <div class="reel-shimmer"></div>
          <div class="reel-shimmer-bottom"></div>
          <div class="reel" id="reelTrack3"></div>
        </div>
        <div class="reel-wrapper" id="reel4">
          <div class="reel-shimmer"></div>
          <div class="reel-shimmer-bottom"></div>
          <div class="reel" id="reelTrack4"></div>
        </div>
      </div>

      <div class="water-bar-bottom"></div>

      <!-- ==========================================
           PAINEL DE INFORMAÇÕES — edite os labels aqui
           ========================================== -->
      <div class="balance-row">

        <!-- BLOCO 1: SALDO -->
        <div class="balance-box">
          <div class="balance-label">Saldo</div>             <!-- ← troque o label aqui -->
          <div class="balance-value" id="balanceVal">💰 500</div>
        </div>

        <!-- BLOCO 2: APOSTA -->
        <div class="balance-box">
          <div class="balance-label">Aposta</div>            <!-- ← troque o label aqui -->
          <div class="bet-control">
            <button class="bet-btn" id="betDown">−</button>
            <div class="bet-value" id="betVal">10</div>
            <button class="bet-btn" id="betUp">+</button>
          </div>
        </div>

        <!-- BLOCO 3: ÚLTIMO GANHO -->
        <div class="balance-box">
          <div class="balance-label">Último Ganho</div>      <!-- ← troque o label aqui -->
          <div class="balance-value" id="lastWinVal">—</div>
        </div>

      </div>
      <!-- FIM DO PAINEL -->

      <button class="spin-btn" id="spinBtn">
        <span class="ripple"></span>
        🎣 GIRAR 🎣
      </button>

      <div class="result-msg" id="resultMsg"></div>
    </div>
  </div>
</div>

<script src="../casino-wallet.js"></script>
<script>
// ==========================================
// SÍMBOLOS — adicione, remova ou troque emojis
// ==========================================
const SYMBOLS = ['🐟','🐠','🦈','🐡','🦞','🐚','💎','🌿','🪸','🎣'];
const GRID_SIZE = 5;
const SYMBOL_H = 58;

// Peso de cada símbolo (maior = aparece mais)
// Deve ter o mesmo número de itens que SYMBOLS
const WEIGHTS =  [30,  25,  5,   25,  9,  19,  2,   30,  10,  8];

// Valor-base de cada símbolo para grupos conectados de 4 ou mais.
const SYMBOL_VALUES = {
  '🐟': 1.2,
  '🐠': 1.5,
  '🦈': 6,
  '🐡': 1.3,
  '🦞': 2.5,
  '🐚': 1.6,
  '💎': 10,
  '🌿': 1,
  '🪸': 2,
  '🎣': 3,
};

// ==========================================
// SALDO E APOSTA — valores iniciais
// ==========================================
let balance = CasinoWallet.getBalance();

let bet     = 10;    // aposta inicial
const BET_MIN  = 10; // aposta mínima
const BET_MAX  = 100;// aposta máxima
const BET_STEP = 10; // quanto sobe/desce cada clique


// ==========================================
// NÃO MEXA ABAIXO — lógica do jogo
// ==========================================
let spinning = false;

function weightedRandom() {
  const total = WEIGHTS.reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < SYMBOLS.length; i++) {
    r -= WEIGHTS[i];
    if (r <= 0) return SYMBOLS[i];
  }
  return SYMBOLS[0];
}

function buildReel(id, initial) {
  const track = document.getElementById('reelTrack' + id);
  track.innerHTML = '';
  initial.forEach(sym => {
    const div = document.createElement('div');
    div.className = 'symbol';
    div.textContent = sym;
    track.appendChild(div);
  });
}

function initReels() {
  for (let i = 0; i < GRID_SIZE; i++) {
    const col = [];
    for (let j = 0; j < GRID_SIZE; j++) col.push(weightedRandom());
    buildReel(i, col);
    document.getElementById('reelTrack' + i).style.transform = 'translateY(0)';
  }
}

initReels();
updateUI();

function updateUI() {
  document.getElementById('balanceVal').textContent = '💰 ' + balance.toLocaleString('pt-BR', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
  document.getElementById('betVal').textContent = bet;
}

CasinoWallet.subscribe(newBalance => {
  balance = newBalance;
  if (!spinning) updateUI();
});

window.addEventListener('focus', () => {
  if (!spinning) {
    balance = CasinoWallet.getBalance();
    updateUI();
  }
});

document.getElementById('betUp').onclick = () => {
  if (!spinning) { bet = Math.min(bet + BET_STEP, BET_MAX); updateUI(); }
};
document.getElementById('betDown').onclick = () => {
  if (!spinning) { bet = Math.max(bet - BET_STEP, BET_MIN); updateUI(); }
};

document.getElementById('spinBtn').onclick = doSpin;

function doSpin() {
  if (spinning) return;

  balance = CasinoWallet.getBalance();
  if (!CasinoWallet.debit(bet)) {
    document.getElementById('resultMsg').textContent = '🌊 Saldo insuficiente!';
    document.getElementById('resultMsg').className = 'result-msg msg-lose';
    updateUI();
    return;
  }

  spinning = true;
  balance = CasinoWallet.getBalance();
  updateUI();

  document.getElementById('resultMsg').textContent = '';
  document.getElementById('resultMsg').className = 'result-msg';
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('lastWinVal').textContent = '—';

  const resultColumns = Array.from(
    { length: GRID_SIZE },
    () => Array.from({ length: GRID_SIZE }, weightedRandom)
  );
  let done = 0;

  for (let column = 0; column < GRID_SIZE; column++) {
    const track = document.getElementById('reelTrack' + column);
    const delay = column * 115;
    const spinCount = 16 + Math.floor(Math.random() * 5) + column * 2;
    const cascade = Array.from({ length: spinCount }, weightedRandom);
    cascade.push(...resultColumns[column]);

    track.innerHTML = '';
    cascade.forEach(sym => {
      const div = document.createElement('div');
      div.className = 'symbol';
      div.textContent = sym;
      track.appendChild(div);
    });

    const targetY = -spinCount * SYMBOL_H;
    track.style.transition = 'none';
    track.style.transform = 'translateY(0)';

    setTimeout(() => {
      const duration = 850 + column * 135 + Math.random() * 90;
      track.style.transition = `transform ${duration}ms cubic-bezier(0.16, 0.72, 0.3, 1)`;
      track.style.transform = `translateY(${targetY}px)`;
      setTimeout(() => {
        done++;
        if (done === GRID_SIZE) finish(resultColumns);
      }, duration + 80);
    }, delay + 60);
  }
}

function findWinningClusters(grid) {
  const visited = Array.from(
    { length: GRID_SIZE },
    () => Array(GRID_SIZE).fill(false)
  );
  const clusters = [];
  const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  for (let row = 0; row < GRID_SIZE; row++) {
    for (let column = 0; column < GRID_SIZE; column++) {
      if (visited[row][column]) continue;

      const symbol = grid[row][column];
      const queue = [{ row, column }];
      const cells = [];
      visited[row][column] = true;

      while (queue.length) {
        const current = queue.shift();
        cells.push(current);

        directions.forEach(([rowStep, columnStep]) => {
          const nextRow = current.row + rowStep;
          const nextColumn = current.column + columnStep;
          const isInside = nextRow >= 0 && nextRow < GRID_SIZE
            && nextColumn >= 0 && nextColumn < GRID_SIZE;

          if (
            isInside
            && !visited[nextRow][nextColumn]
            && grid[nextRow][nextColumn] === symbol
          ) {
            visited[nextRow][nextColumn] = true;
            queue.push({ row: nextRow, column: nextColumn });
          }
        });
      }

      if (cells.length >= 4) clusters.push({ symbol, cells });
    }
  }

  return clusters;
}

function getClusterMultiplier(size) {
  if (size >= 10) return 10 + (size - 10) * 2;
  if (size >= 8) return 5 + (size - 8) * 2;
  if (size >= 6) return 2 + (size - 6);
  if (size === 5) return 1.5;
  return 1;
}

function highlightClusters(clusters) {
  clusters.forEach(cluster => {
    cluster.cells.forEach(({ row, column }) => {
      const track = document.getElementById('reelTrack' + column);
      const firstVisibleIndex = track.children.length - GRID_SIZE;
      track.children[firstVisibleIndex + row]?.classList.add('connected');
    });
  });
}

function finish(resultColumns) {
  const msg = document.getElementById('resultMsg');
  const lastWin = document.getElementById('lastWinVal');
  const grid = Array.from(
    { length: GRID_SIZE },
    (_, row) => resultColumns.map(column => column[row])
  );
  const clusters = findWinningClusters(grid);
  const connectedItems = clusters.reduce((total, cluster) => total + cluster.cells.length, 0);
  const win = Math.round(clusters.reduce((total, cluster) => {
    const symbolValue = SYMBOL_VALUES[cluster.symbol];
    return total + bet * symbolValue * getClusterMultiplier(cluster.cells.length);
  }, 0));

  balance = win > 0 ? CasinoWallet.credit(win) : CasinoWallet.getBalance();
  updateUI();

  if (win > 0) {
    highlightClusters(clusters);
    lastWin.textContent = '+' + win;
    if (win >= bet * 50) {
      msg.textContent = `🎉 MEGA CONEXÃO! ${connectedItems} ITENS • +${win} 🎉`;
      msg.className = 'result-msg msg-jackpot';
    } else if (win >= bet * 10) {
      msg.textContent = `🐟 GRANDE CONEXÃO! ${connectedItems} ITENS • +${win}`;
      msg.className = 'result-msg msg-win';
    } else {
      msg.textContent = `✨ ${connectedItems} CONECTADOS • +${win}`;
      msg.className = 'result-msg msg-win';
    }
  } else {
    msg.textContent = balance < bet
      ? '🌊 Sem saldo! Recarregue.'
      : '🌿 Conecte pelo menos 4 símbolos.';
    msg.className = 'result-msg msg-lose';
    if (balance < 10) {
      setTimeout(() => {
        balance = CasinoWallet.setBalance(500);
        updateUI();
      }, 1800);
    }
  }

  spinning = false;
  document.getElementById('spinBtn').disabled = false;
}
</script>

</body>
</html>
