<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big Bass Splash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="slot.css" />
</head>
<body>

<div class="machine-wrap">
  <div class="fish-deco" aria-hidden="true">🌿 🐟 🌿 🐠 🌿</div>

  <div class="machine-title">BIG BASS SPLASH</div>
  <div class="subtitle">🎣 Conecte 4 ou mais símbolos 🎣</div>

  <div class="machine-body">
    <div class="machine-inner">
      <div class="water-bar"></div>

      <div class="reels-container" id="reelsContainer" aria-label="Grade do Slot com 5 linhas e 5 colunas">
        <div class="reel-wrapper" id="reel0">
          <div class="reel-shimmer"></div>
          <div class="reel-shimmer-bottom"></div>
          <div class="reel" id="reelTrack0"></div>
        </div>
        <div class="reel-wrapper" id="reel1">
          <div class="reel-shimmer"></div>
          <div class="reel-shimmer-bottom"></div>
          <div class="reel" id="reelTrack1"></div>
        </div>
        <div class="reel-wrapper" id="reel2">
          <div class="reel-shimmer"></div>
          <div class="reel-shimmer-bottom"></div>
          <div class="reel" id="reelTrack2"></div>
        </div>
        <div class="reel-wrapper" id="reel3">
          <div class="reel-shimmer"></div>
          <div class="reel-shimmer-bottom"></div>
          <div class="reel" id="reelTrack3"></div>
        </div>
        <div class="reel-wrapper" id="reel4">
          <div class="reel-shimmer"></div>
          <div class="reel-shimmer-bottom"></div>
          <div class="reel" id="reelTrack4"></div>
        </div>
      </div>

      <div class="water-bar-bottom"></div>

      <div class="balance-row">
        <div class="balance-box">
          <div class="balance-label">Saldo</div>
          <div class="balance-value" id="balanceVal">💰 R$ 0,00</div>
        </div>

        <div class="balance-box">
          <div class="balance-label">Aposta</div>
          <div class="bet-control">
            <button class="bet-btn" id="betDown" type="button" aria-label="Diminuir aposta">−</button>
            <div class="bet-value" id="betVal">R$ 10,00</div>
            <button class="bet-btn" id="betUp" type="button" aria-label="Aumentar aposta">+</button>
          </div>
        </div>

        <div class="balance-box">
          <div class="balance-label">Último ganho</div>
          <div class="balance-value" id="lastWinVal">—</div>
        </div>
      </div>

      <button class="spin-btn" id="spinBtn" type="button">
        <span class="ripple"></span>
        🎣 GIRAR 🎣
      </button>

      <div class="result-msg" id="resultMsg" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>

<script src="slot.js"></script>
</body>
</html>
