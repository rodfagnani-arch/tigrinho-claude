<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big Bass Splash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="slot.css" />
</head>
<body>

<div class="machine-wrap">
  <div class="fish-deco">🌿 🐟 🌿 🐠 🌿</div>

  <!-- ==========================================
       TÍTULO — edite o nome aqui
       ========================================== -->
  <div class="machine-title">BIG BASS SPLASH</div>
  <div class="subtitle">🎣 Pesca de Fortuna 🎣</div>

  <div class="machine-body">
    <div class="machine-inner">
      <div class="water-bar"></div>

      <!-- ROLOS -->
      <div class="reels-container" id="reelsContainer">
        <div class="win-line" id="winLine"></div>
        <div class="reel-wrapper" id="reel0">
          <div class="reel-shimmer"></div>
          <div class="reel-shimmer-bottom"></div>
          <div class="reel" id="reelTrack0"></div>
        </div>
        <div class="reel-wrapper" id="reel1">
          <div class="reel-shimmer"></div>
          <div class="reel-shimmer-bottom"></div>
          <div class="reel" id="reelTrack1"></div>
        </div>
        <div class="reel-wrapper" id="reel2">
          <div class="reel-shimmer"></div>
          <div class="reel-shimmer-bottom"></div>
          <div class="reel" id="reelTrack2"></div>
        </div>
      </div>

      <div class="water-bar-bottom"></div>

      <!-- ==========================================
           PAINEL DE INFORMAÇÕES — edite os labels aqui
           ========================================== -->
      <div class="balance-row">

        <!-- BLOCO 1: SALDO -->
        <div class="balance-box">
          <div class="balance-label">Saldo</div>             <!-- ← troque o label aqui -->
          <div class="balance-value" id="balanceVal">💰 500</div>
        </div>

        <!-- BLOCO 2: APOSTA -->
        <div class="balance-box">
          <div class="balance-label">Aposta</div>            <!-- ← troque o label aqui -->
          <div class="bet-control">
            <button class="bet-btn" id="betDown">−</button>
            <div class="bet-value" id="betVal">10</div>
            <button class="bet-btn" id="betUp">+</button>
          </div>
        </div>

        <!-- BLOCO 3: ÚLTIMO GANHO -->
        <div class="balance-box">
          <div class="balance-label">Último Ganho</div>      <!-- ← troque o label aqui -->
          <div class="balance-value" id="lastWinVal">—</div>
        </div>

      </div>
      <!-- FIM DO PAINEL -->

      <button class="spin-btn" id="spinBtn">
        <span class="ripple"></span>
        🎣 GIRAR 🎣
      </button>

      <div class="result-msg" id="resultMsg"></div>
    </div>
  </div>
</div>

<script>
// ==========================================
// SÍMBOLOS — adicione, remova ou troque emojis
// ==========================================
const SYMBOLS = ['🐟','🐠','🦈','🐡','🦞','🐚','💎','🌿','🪸','🎣'];

// Peso de cada símbolo (maior = aparece mais)
// Deve ter o mesmo número de itens que SYMBOLS
const WEIGHTS =  [30,  25,  5,   25,  9,  19,  2,   30,  10,  8];

// Pagamento por símbolo: [ignorar, ignorar, multiplicador par, multiplicador trio]
const PAYOUTS = {
  '🐟': [0, 0, 5,   15],
  '🐠': [0, 0, 8,   20],
  '🦈': [0, 0, 40, 120],
  '🐡': [0, 0, 6,   18],
  '🦞': [0, 0, 12,  35],
  '🐚': [0, 0, 7,   22],
  '💎': [0, 0, 100,500],
  '🌿': [0, 0, 4,   12],
  '🪸': [0, 0, 10,  28],
  '🎣': [0, 0, 15,  50],
};

// ==========================================
// SALDO E APOSTA — valores iniciais
// ==========================================
let balance = localStorage.getItem("saldoCassino")
  ? parseInt(localStorage.getItem("saldoCassino"))
  : 100000;   // saldo inicial do jogador
  function salvarSaldo() {
  localStorage.setItem("saldoCassino", balance);
}

let bet     = 10;    // aposta inicial
const BET_MIN  = 10; // aposta mínima
const BET_MAX  = 100;// aposta máxima
const BET_STEP = 10; // quanto sobe/desce cada clique


// ==========================================
// NÃO MEXA ABAIXO — lógica do jogo
// ==========================================
let spinning = false;

function weightedRandom() {
  const total = WEIGHTS.reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < SYMBOLS.length; i++) {
    r -= WEIGHTS[i];
    if (r <= 0) return SYMBOLS[i];
  }
  return SYMBOLS[0];
}

function buildReel(id, initial) {
  const track = document.getElementById('reelTrack' + id);
  track.innerHTML = '';
  initial.forEach(sym => {
    const div = document.createElement('div');
    div.className = 'symbol';
    div.textContent = sym;
    track.appendChild(div);
  });
}

function initReels() {
  for (let i = 0; i < 3; i++) {
    const col = [];
    for (let j = 0; j < 5; j++) col.push(weightedRandom());
    buildReel(i, col);
    document.getElementById('reelTrack' + i).style.transform = 'translateY(-66px)';
  }
}

initReels();
updateUI();

function updateUI() {
  document.getElementById('balanceVal').textContent = '💰 ' + balance;
  document.getElementById('betVal').textContent = bet;

  salvarSaldo(); // 🔥 salva automaticamente  
}

document.getElementById('betUp').onclick = () => {
  if (!spinning) { bet = Math.min(bet + BET_STEP, BET_MAX); updateUI(); }
};
document.getElementById('betDown').onclick = () => {
  if (!spinning) { bet = Math.max(bet - BET_STEP, BET_MIN); updateUI(); }
};

document.getElementById('spinBtn').onclick = doSpin;

function doSpin() {
  if (spinning || balance < bet) return;
  spinning = true;
  balance -= bet;
  updateUI();

  document.getElementById('resultMsg').textContent = '';
  document.getElementById('resultMsg').className = 'result-msg';
  document.getElementById('winLine').className = 'win-line';
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('lastWinVal').textContent = '—';

  const results = [weightedRandom(), weightedRandom(), weightedRandom()];
  const SYMBOL_H = 66;
  let done = 0;

  for (let i = 0; i < 3; i++) {
    const track = document.getElementById('reelTrack' + i);
    const delay = i * 160;
    const cascade = [];
    const count = 18 + Math.floor(Math.random() * 6) + i * 4;
    for (let k = 0; k < count - 3; k++) cascade.push(weightedRandom());
    cascade.push(weightedRandom());
    cascade.push(results[i]);
    cascade.push(weightedRandom());

    track.innerHTML = '';
    cascade.forEach(sym => {
      const div = document.createElement('div');
      div.className = 'symbol';
      div.textContent = sym;
      track.appendChild(div);
    });

    const targetIndex = cascade.length - 2;
    const targetY = -targetIndex * SYMBOL_H;
    track.style.transition = 'none';
    track.style.transform = 'translateY(0)';

    setTimeout(() => {
      const duration = 900 + i * 200 + Math.random() * 100;
      track.style.transition = `transform ${duration}ms cubic-bezier(0.17, 0.67, 0.35, 1.0)`;
      track.style.transform = `translateY(${targetY}px)`;
      setTimeout(() => { done++; if (done === 3) finish(results); }, duration + 100);
    }, delay + 60);
  }
}

function finish(results) {
  const msg     = document.getElementById('resultMsg');
  const lastWin = document.getElementById('lastWinVal');
  const winLine = document.getElementById('winLine');

  const match3 = results[0] === results[1] && results[1] === results[2];
  const match2 = results[0] === results[1] || results[1] === results[2] || results[0] === results[2];
  const matchCount = match3 ? 3 : match2 ? 2 : 0;
  const matchSym = match3 ? results[0]
    : results[0] === results[1] ? results[0]
    : results[1] === results[2] ? results[1]
    : results[0] === results[2] ? results[0] : null;

  let win = 0;
  if (matchSym && matchCount >= 2) {
    win = Math.round(bet * PAYOUTS[matchSym][matchCount]);
   }

  balance += win;
  updateUI();

  if (win > 0) {
    winLine.className = 'win-line active';
    lastWin.textContent = '+' + win;
    if (win >= bet * 50) {
      msg.textContent = '🎉 BIG WIN! +' + win + ' 🎉';
      msg.className = 'result-msg msg-jackpot';
    } else if (win >= bet * 10) {
      msg.textContent = '🐟 WIN! +' + win + '!';
      msg.className = 'result-msg msg-win';
    } else {
      msg.textContent = '✨ Peixinho! +' + win;
      msg.className = 'result-msg msg-win';
    }
  } else {
    msg.textContent = balance < bet ? '🌊 Sem saldo! Recarregue.' : '🌿 Nada dessa vez... tente de novo!';
    msg.className = 'result-msg msg-lose';
    if (balance < 10) { setTimeout(() => { balance = 500; updateUI(); }, 1800); }
  }

  spinning = false;
  document.getElementById('spinBtn').disabled = false;
}
</script>

</body>
</html>
